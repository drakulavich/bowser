<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Controls</title>
</head>
<body>
  <main>
    <h1>Controls</h1>
    <!-- A same-document URL change: WebKit's view.url keeps the old URL. -->
    <button onclick="history.pushState({}, '', '/pushed?x=1')">Push</button>
    <!-- Change handlers that navigate; the test server answers /next slowly. -->
    <select aria-label="Pick" onchange="location.href = '/next'">
      <option value="a">a</option>
      <option value="b">b</option>
    </select>
    <input type="checkbox" aria-label="Go" onchange="location.href = '/next'" />
  </main>
</body>
</html>
