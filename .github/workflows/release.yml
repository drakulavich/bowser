name: release

on:
  push:
    tags:
      - "v*"
  # Allow manual runs from the Actions UI (handy for re-publishing binaries
  # against an already-pushed tag). Every job checks out that tag, not the
  # branch the run was started from.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # bowser runs only on macOS (WebKit through Bun.WebView). Both targets
        # build on macos-latest (Apple silicon); the x64 one is a cross-compile,
        # which avoids queuing on the scarce Intel runners.
        include:
          - os: macos-latest
            target: bun-darwin-arm64
            asset: bowser-macos-arm64
          - os: macos-latest
            target: bun-darwin-x64
            asset: bowser-macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: Compile single-file binary
        run: |
          mkdir -p dist
          bun build src/cli.ts \
            --compile \
            --target=${{ matrix.target }} \
            --outfile dist/${{ matrix.asset }}
      - name: Smoke-test the binary
        # Only run when the compiled target matches the runner — everything
        # else is a cross-compile that can't execute here.
        if: matrix.target == 'bun-darwin-arm64'
        run: ./dist/${{ matrix.asset }} --help
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release + upload assets
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false
      - name: Resolve tag
        id: tag
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: echo "name=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: List downloaded assets
        run: ls -la dist
      - name: Compute SHA-256 checksums
        run: |
          cd dist
          sha256sum bowser-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Bowser ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          files: |
            dist/bowser-macos-arm64
            dist/bowser-macos-x64
            dist/SHA256SUMS.txt

  npm:
    # Publish @drakulavich/bowser-cli through npm trusted publishing (OIDC):
    # npmjs.com trusts this repository and this workflow file name, and no npm
    # token exists anywhere. access: public comes from package.json's
    # publishConfig.
    needs: publish
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.inputs.tag || github.ref_name, '-') }} # skip prereleases like v0.1.0-rc.1
    permissions:
      contents: read
      id-token: write # the OIDC token npm exchanges for a publish credential
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false
      # Trusted publishing needs npm 11.5.1 or newer, which Node 24 bundles.
      # Nothing is installed from the network into the job that holds the
      # OIDC token.
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: npm must be 11.5.1 or newer
        run: |
          have=$(npm --version)
          [ "$(printf '11.5.1\n%s\n' "$have" | sort -V | head -1)" = "11.5.1" ] || { echo "::error::npm $have is older than 11.5.1"; exit 1; }
      # The tag reaches the shell through env, never by interpolation: this
      # job holds id-token: write.
      - name: Verify version matches tag
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          PKG=$(jq -r .version package.json)
          if [ "$PKG" != "${TAG#v}" ]; then
            echo "::error::package.json version ($PKG) does not match tag ($TAG)"
            exit 1
          fi
      # A rerun after a successful publish skips instead of failing on E403.
      - name: Publish to npm
        run: |
          NAME=$(jq -r .name package.json)
          VERSION=$(jq -r .version package.json)
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm; skipping"
            exit 0
          fi
          npm publish --provenance
