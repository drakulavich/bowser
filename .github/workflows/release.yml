name: release

on:
  push:
    tags:
      - "v*"
  # Allow manual runs from the Actions UI (handy for re-running a release
  # against an already-pushed tag). The release is made for that tag, and the
  # npm job checks it out, not the branch the run was started from.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true

permissions:
  contents: read

jobs:
  # bowser ships only through npm (and from source): no binaries are built or
  # attached. The GitHub Release carries generated notes and no assets.
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
    steps:
      - name: Resolve tag
        id: tag
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: echo "name=$TAG" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Bowser ${{ steps.tag.outputs.name }}
          generate_release_notes: true

  npm:
    # Publish @drakulavich/bowser-cli through npm trusted publishing (OIDC):
    # npmjs.com trusts this repository and this workflow file name, and no npm
    # token exists anywhere. access: public comes from package.json's
    # publishConfig.
    needs: publish
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.inputs.tag || github.ref_name, '-') }} # skip prereleases like v0.1.0-rc.1
    permissions:
      contents: read
      id-token: write # the OIDC token npm exchanges for a publish credential
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false
      # Trusted publishing needs npm 11.5.1 or newer, which Node 24 bundles.
      # Nothing is installed from the network into the job that holds the
      # OIDC token.
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: npm must be 11.5.1 or newer
        run: |
          have=$(npm --version)
          [ "$(printf '11.5.1\n%s\n' "$have" | sort -V | head -1)" = "11.5.1" ] || { echo "::error::npm $have is older than 11.5.1"; exit 1; }
      # The tag reaches the shell through env, never by interpolation: this
      # job holds id-token: write.
      - name: Verify version matches tag
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          PKG=$(jq -r .version package.json)
          if [ "$PKG" != "${TAG#v}" ]; then
            echo "::error::package.json version ($PKG) does not match tag ($TAG)"
            exit 1
          fi
      # A rerun after a successful publish skips instead of failing on E403.
      - name: Publish to npm
        run: |
          NAME=$(jq -r .name package.json)
          VERSION=$(jq -r .version package.json)
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm; skipping"
            exit 0
          fi
          npm publish --provenance
