name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# bowser drives WebKit through Bun.WebView, which exists only on macOS, so
# every job runs on a macOS runner.
jobs:
  unit:
    name: unit (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ">=1.3.12"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  build:
    name: build single binary
    runs-on: macos-latest
    needs: unit
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ">=1.3.12"
      - run: bun install --frozen-lockfile
      - run: bun build src/cli.ts --compile --outfile dist/bowser
      - run: ./dist/bowser --help

  e2e-webkit:
    name: e2e (WebKit, macOS)
    runs-on: macos-latest
    needs: unit
    env:
      BOWSER_E2E: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ">=1.3.12"
      - run: bun install --frozen-lockfile
      - name: E2E on WebKit
        # e2e-compat skips here: the runner has no playwright-cli.
        run: bun test tests/e2e.test.ts tests/e2e-todo.test.ts tests/e2e-snapshot.test.ts tests/e2e-stale-ref.test.ts tests/e2e-password.test.ts tests/e2e-webkit.test.ts tests/e2e-webkit-sessions.test.ts tests/e2e-daemon-death.test.ts tests/e2e-persistent.test.ts tests/e2e-fill-stdin.test.ts tests/e2e-dialogs.test.ts tests/e2e-compat.test.ts
      - name: E2E - compiled binary daemon + screenshot
        # The suites above run in-process via `bun test` and never exercise the
        # COMPILED binary's daemon-spawn path (it re-invokes itself with a hidden
        # --daemon flag). This step drives the real single-file binary end to end
        # so a regression in that path fails CI instead of shipping.
        #
        # Each command is bounded: a daemon-spawning command that fails to unref
        # its child would hang forever (it once burned the full 6 h job budget).
        # macOS ships no `timeout`; perl's alarm survives exec, so it bounds the
        # child the same way.
        run: |
          bun build src/cli.ts --compile --outfile dist/bowser
          t() { perl -e 'alarm shift; exec @ARGV or die "exec failed: $!"' -- 60 "$@"; }
          t ./dist/bowser open "data:text/html,<h1>ci</h1>" --session ci-smoke
          t ./dist/bowser screenshot --session ci-smoke --filename /tmp/ci-smoke.png
          t ./dist/bowser close --session ci-smoke
          file /tmp/ci-smoke.png | grep -q "PNG image data"
          # --persistent must reach the daemon through --daemon too: the CLI
          # creates the empty profile directory before it spawns the daemon, and
          # only a browser opened with it writes into it. close must leave it.
          t ./dist/bowser open "data:text/html,<h1>ci</h1>" --persistent --session ci-persist
          test -n "$(ls -A ~/.bowser/profiles/ci-persist)"
          t ./dist/bowser close --session ci-persist
          test -d ~/.bowser/profiles/ci-persist
          rm -rf ~/.bowser/profiles/ci-persist
