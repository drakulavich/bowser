name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ">=1.3.12"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  build:
    name: build single binary
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ">=1.3.12"
      - run: bun install --frozen-lockfile
      - run: bun build src/cli.ts --compile --outfile dist/bowser
      - run: ./dist/bowser --help

  e2e:
    name: e2e (Chromium, Linux)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ">=1.3.12"
      - run: bun install --frozen-lockfile
      - name: Install headless Chromium
        # --force so the bowser-managed cache exists even when the runner
        # already has a system Chrome (e2e tests redirect $HOME and won't
        # find the system install).
        run: bun src/cli.ts install --force
      - name: Install Chromium system deps
        # `bowser install` downloads the binary but not apt dependencies.
        # Piggyback on Playwright's install-deps since it's already available.
        run: bunx --bun playwright install-deps chromium
      - name: Locate Chromium binary
        id: chromium
        # Tests redirect $HOME to a tmp dir before calling detectChromium(),
        # so the bowser cache becomes invisible. Pass the absolute path
        # explicitly via BOWSER_CHROMIUM_PATH instead.
        run: |
          path=$(find ~/.bowser/chromium -type f -name chrome-headless-shell | head -1)
          test -n "$path"
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - name: E2E - data URL smoke test
        env:
          BOWSER_E2E: "1"
          BOWSER_CHROME_ARGS: "--no-sandbox"
          BOWSER_CHROMIUM_PATH: ${{ steps.chromium.outputs.path }}
        run: bun test tests/e2e.test.ts
      - name: E2E - local todo app
        env:
          BOWSER_E2E: "1"
          BOWSER_CHROME_ARGS: "--no-sandbox"
          BOWSER_CHROMIUM_PATH: ${{ steps.chromium.outputs.path }}
        run: bun test tests/e2e-todo.test.ts
      - name: E2E - compiled binary daemon + screenshot
        # The unit/e2e suites run in-process via `bun test` and never exercise
        # the COMPILED binary's daemon-spawn path (it re-invokes itself with a
        # hidden --daemon flag). This step drives the real single-file binary
        # end-to-end so a regression in that path fails CI instead of shipping.
        env:
          BOWSER_CHROME_ARGS: "--no-sandbox"
          BOWSER_CHROMIUM_PATH: ${{ steps.chromium.outputs.path }}
        run: |
          bun build src/cli.ts --compile --outfile dist/bowser
          # Wrap each command in `timeout`: a daemon-spawning command that fails
          # to unref its child would hang forever (it once burned the full 6 h job
          # budget). The guard turns a regression into a fast, clear failure.
          timeout 60 ./dist/bowser open "data:text/html,<h1>ci</h1>" --session ci-smoke
          timeout 60 ./dist/bowser screenshot --session ci-smoke --filename /tmp/ci-smoke.png
          timeout 60 ./dist/bowser close --session ci-smoke
          file /tmp/ci-smoke.png | grep -q "PNG image data"

  e2e-webkit:
    name: e2e (WebKit, macOS)
    runs-on: macos-latest
    needs: unit
    env:
      BOWSER_E2E: "1"
      BOWSER_BACKEND: webkit
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ">=1.3.12"
      - run: bun install --frozen-lockfile
      - name: E2E on WebKit
        # e2e-compat skips here: the runner has no playwright-cli.
        run: bun test tests/e2e.test.ts tests/e2e-todo.test.ts tests/e2e-webkit.test.ts tests/e2e-compat.test.ts
      - name: E2E - compiled binary daemon + screenshot (WebKit)
        # Same guard as the Linux job. macOS ships no `timeout`; perl's alarm
        # survives exec, so it bounds the child the same way.
        run: |
          bun build src/cli.ts --compile --outfile dist/bowser
          t() { perl -e 'alarm shift; exec @ARGV or die "exec failed: $!"' -- 60 "$@"; }
          t ./dist/bowser open "data:text/html,<h1>ci</h1>" --session ci-smoke
          t ./dist/bowser screenshot --session ci-smoke --filename /tmp/ci-smoke.png
          t ./dist/bowser close --session ci-smoke
          file /tmp/ci-smoke.png | grep -q "PNG image data"
