name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# bowser drives WebKit through Bun.WebView, which exists only on macOS, so
# every job runs on a macOS runner.
jobs:
  unit:
    name: unit (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ">=1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test

  e2e-webkit:
    name: e2e (WebKit, macOS)
    runs-on: macos-latest
    needs: unit
    env:
      BOWSER_E2E: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ">=1.4.2"
      - run: bun install --frozen-lockfile
      - name: E2E on WebKit
        # e2e-compat skips here: the runner has no playwright-cli.
        run: bun test tests/e2e.test.ts tests/e2e-todo.test.ts tests/e2e-snapshot.test.ts tests/e2e-stale-ref.test.ts tests/e2e-password.test.ts tests/e2e-webkit.test.ts tests/e2e-webkit-sessions.test.ts tests/e2e-daemon-death.test.ts tests/e2e-orphan.test.ts tests/e2e-persistent.test.ts tests/e2e-fill-stdin.test.ts tests/e2e-dialogs.test.ts tests/e2e-far-element.test.ts tests/e2e-forms.test.ts tests/e2e-actions.test.ts tests/e2e-hangs.test.ts tests/e2e-session-claim.test.ts tests/e2e-mcp.test.ts tests/e2e-spawn-exit.test.ts tests/e2e-compat.test.ts
      - name: E2E - the npm package, installed
        # Runs what a user installs: `npm pack`, then `npm i -g` into a temp
        # prefix, then that prefix's bin/bowser. This covers the `files` list (a
        # source file left out of the package fails here and nowhere else), the
        # `bin` mapping, the `#!/usr/bin/env bun` shebang, and the installed
        # layout the daemon path (<package>/src/daemon/main.ts) is computed from.
        #
        # Each command is bounded: a daemon-spawning command that fails to unref
        # its child would hang forever (it once burned the full 6 h job budget).
        # macOS ships no `timeout`; perl's alarm survives exec, so it bounds the
        # child the same way. HOME is a temp dir, so nothing touches ~/.bowser.
        env:
          HOME: ${{ runner.temp }}/home
        run: |
          mkdir -p "$HOME"
          prefix="$RUNNER_TEMP/npm"
          bowser="$prefix/bin/bowser"
          t() { perl -e 'alarm shift; exec @ARGV or die "exec failed: $!"' -- 60 "$@"; }
          cleanup() {
            if [ -x "$bowser" ]; then
              t "$bowser" close --session ci-smoke >/dev/null 2>&1 || true
              t "$bowser" close --session ci-persist >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT
          tarball="$(t npm pack --silent --pack-destination "$RUNNER_TEMP")"
          t npm i -g --prefix "$prefix" "$RUNNER_TEMP/$tarball"
          t "$bowser" open "data:text/html,<h1>ci</h1>" --session ci-smoke
          t "$bowser" eval "document.querySelector('h1').textContent" --session ci-smoke | grep -q ci
          # The daemon runs from the installed package, as `bun <pkg>/src/daemon/main.ts <session>`.
          pgrep -f "$prefix/lib/node_modules/@drakulavich/bowser-cli/src/daemon/main.ts ci-smoke" >/dev/null
          t "$bowser" screenshot --session ci-smoke --filename "$RUNNER_TEMP/ci-smoke.png"
          t "$bowser" close --session ci-smoke
          file "$RUNNER_TEMP/ci-smoke.png" | grep -q "PNG image data"
          # --persistent reaches the daemon through its env: the CLI creates the
          # empty profile directory before it spawns the daemon, and only a
          # browser opened with it writes into it. close must leave it.
          t "$bowser" open "data:text/html,<h1>ci</h1>" --persistent --session ci-persist
          test -n "$(ls -A "$HOME/.bowser/profiles/ci-persist")"
          t "$bowser" close --session ci-persist
          test -d "$HOME/.bowser/profiles/ci-persist"
